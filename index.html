<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>兔巢 Lobit</title><meta name="theme-color" content="#40502F"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap"><style>
  :root{
    --bg: #F2EEE2;
    --bg-deep: #EAE4D2;
    --surface: #FFFFFF;
    --surface-soft: #FBF9F2;
    --ink: #2A2620;
    --ink-soft: #6C6355;
    --ink-faint: #9C9384;
    --line: #E3DCC8;
    --moss: #3F5030;
    --moss-deep: #2E3B22;
    --moss-soft: #DEE5CE;
    --clay: #B4763A;
    --clay-soft: #F1DFC4;
    --brick: #B23F27;
    --brick-soft: #F5DAD1;
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    --shadow: 0 1px 2px rgba(42,38,32,.06), 0 6px 18px rgba(42,38,32,.07);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans TC', sans-serif;
    background: var(--bg-deep);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Noto Serif TC', serif; }
  button{ font-family:inherit; }
  ::selection{ background: var(--moss-soft); }

  #frame{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 60px rgba(0,0,0,.18);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    padding: 18px 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{
    width:30px; height:30px; border-radius: 9px;
    background: var(--moss); color:#fff; display:inline-flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px;
    flex-shrink:0;
  }
  .brand h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:.02em;}
  .brand .tagline{ font-size:11.5px; color:var(--ink-faint); display:block; margin-top:1px; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--moss-deep);
  }
  .icon-btn.warn{ border-color: var(--brick); color:var(--brick); }

  /* ---------- Screens ---------- */
  .screen{ display:none; flex:1; padding: 14px 16px 100px; }
  .screen.active{ display:block; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position: sticky; bottom:0; z-index: 30;
    background: var(--surface);
    border-top: 1px solid var(--line);
    display:flex;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; padding:6px 4px; cursor:pointer;
    color: var(--ink-faint); font-size:11.5px; font-weight:600;
  }
  .navbtn svg{ width:22px; height:22px; }
  .navbtn.active{ color: var(--moss); }

  /* ---------- Cards / chips ---------- */
  .chiprow{ display:flex; gap:8px; overflow-x:auto; padding: 2px 0 14px; scrollbar-width:none; }
  .chiprow::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius: 999px; font-size: 13px; font-weight:600;
    border:1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor:pointer;
  }
  .chip.active{ background: var(--moss); border-color: var(--moss); color:#fff; }
  .chip.urgent{ border-color: var(--brick-soft); color: var(--brick); }
  .chip.urgent.active{ background: var(--brick); border-color:var(--brick); color:#fff; }

  .card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-m);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
  }

  /* ---------- Community ---------- */
  .composer-entry{
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: var(--moss-soft); color: var(--moss-deep);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
  }
  .composer-entry .hint{
    flex:1; padding:11px 14px; border-radius: 999px; background: var(--bg-deep);
    color: var(--ink-faint); font-size: 14px;
  }

  .post{ padding:16px; }
  .post-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .post-head .who{ flex:1; }
  .post-head .name{ font-weight:700; font-size:14.5px; }
  .post-head .meta{ font-size:12px; color: var(--ink-faint); }
  .tag{
    font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    background: var(--moss-soft); color: var(--moss-deep);
  }
  .tag.urgent{ background: var(--brick-soft); color: var(--brick); }
  .post-body{ font-size:14.5px; line-height:1.65; white-space:pre-wrap; margin-bottom:12px;}
  .post-actions{ display:flex; gap:18px; border-top:1px solid var(--line); padding-top:10px; }
  .post-actions button{
    background:none; border:none; display:flex; align-items:center; gap:6px;
    color: var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; padding:4px 0;
  }
  .post-actions button.liked{ color: var(--clay); }
  .post-actions svg{ width:17px; height:17px; }

  .comments{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none; }
  .comments.open{ display:block; }
  .comment{ font-size:13.5px; margin-bottom:8px; line-height:1.5; }
  .comment b{ font-weight:700; }
  .comment-form{ display:flex; gap:8px; margin-top:8px; }
  .comment-form input{ flex:1; }

  /* ---------- Forms ---------- */
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%; border:1px solid var(--line); background: var(--surface-soft);
    border-radius: var(--radius-s); padding: 10px 12px; font-size:14px; color:var(--ink);
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:90px; }
  label.field-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin:0 0 6px; }
  .field{ margin-bottom:14px; }
  .btn{
    border:none; border-radius: 999px; padding:11px 20px; font-weight:700; font-size:14.5px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{ background: var(--moss); color:#fff; width:100%; }
  .btn-ghost{ background: var(--bg-deep); color:var(--ink); }
  .btn-brick{ background: var(--brick); color:#fff; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }

  /* ---------- Tracker ---------- */
  .rabbit-strip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:14px; scrollbar-width:none;}
  .rabbit-strip::-webkit-scrollbar{ display:none; }
  .rabbit-chip{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer; width:64px;
  }
  .rabbit-chip .dot{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:18px; color:#fff;
    border: 3px solid transparent;
  }
  .rabbit-chip.active .dot{ border-color: var(--moss); }
  .rabbit-chip span.label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px;}
  .rabbit-chip.add .dot{ background: var(--surface); border:2px dashed var(--line); color: var(--ink-faint); }

  .metric-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom: 4px;}
  .metric{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-s); padding:12px;
  }
  .metric .k{ font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:2px;}
  .metric .v{ font-size:19px; font-weight:700; font-family:'Noto Serif TC',serif; }
  .metric .u{ font-size:12px; color:var(--ink-faint); font-weight:500; }

  .segmented{ display:flex; border:1px solid var(--line); border-radius: 999px; overflow:hidden; background:var(--surface-soft); }
  .segmented button{
    flex:1; border:none; background:none; padding:9px 4px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .segmented button.active{ background: var(--moss); color:#fff; }

  input[type=range]{ width:100%; accent-color: var(--moss); }
  .range-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .log-entry{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .log-entry:last-child{ border-bottom:none; }
  .log-date{ width:56px; flex-shrink:0; text-align:center; }
  .log-date .d{ font-size:18px; font-weight:700; font-family:'Noto Serif TC',serif; }
  .log-date .m{ font-size:10.5px; color:var(--ink-faint); }
  .log-summary{ flex:1; font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .log-summary .flag{ color: var(--brick); font-weight:700; }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px; }
  .empty svg{ width:44px; height:44px; margin-bottom:10px; opacity:.5; }

  /* ---------- Map ---------- */
  #map{ width:100%; height: 260px; border-radius: var(--radius-m); border:1px solid var(--line); margin-bottom:14px; }
  .clinic{ padding:14px; }
  .clinic-name{ font-weight:700; font-size:15px; margin-bottom:2px; }
  .clinic-addr{ font-size:12.5px; color: var(--ink-soft); margin-bottom:8px; }
  .clinic-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .mini-tag{ font-size:11px; font-weight:600; background: var(--bg-deep); color:var(--ink-soft); padding:3px 8px; border-radius:999px;}
  .clinic-actions{ display:flex; gap:8px; }
  .clinic-actions a, .clinic-actions button{
    flex:1; text-align:center; text-decoration:none; font-size:12.5px; font-weight:700; padding:8px; border-radius: var(--radius-s);
  }
  .call-btn{ background: var(--moss-soft); color: var(--moss-deep); }
  .nav-btn{ background: var(--clay-soft); color: #7A4A18; }

  .banner{
    background: var(--brick); color:#fff; border-radius: var(--radius-m); padding:14px 16px;
    display:flex; align-items:center; gap:12px; margin-bottom:14px; cursor:pointer;
  }
  .banner svg{ width:26px; height:26px; flex-shrink:0; }
  .banner .t{ font-weight:700; font-size:14px; }
  .banner .s{ font-size:12px; opacity:.9; }

  /* ---------- Modal ---------- */
  .modal-back{
    position:fixed; inset:0; background: rgba(26,22,16,.5); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-back.open{ display:flex; }
  .modal{
    background: var(--bg); width:100%; max-width:480px; border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    animation: slideup .22s ease-out;
  }
  @keyframes slideup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-head h2{ font-size:17px; margin:0; }
  .modal-close{ background:none; border:none; color:var(--ink-faint); font-size:22px; cursor:pointer; line-height:1;}

  .steplist{ list-style:none; margin:0; padding:0; counter-reset: step; }
  .steplist li{
    counter-increment: step; position:relative; padding-left:34px; margin-bottom:14px; font-size:13.5px; line-height:1.6;
  }
  .steplist li::before{
    content: counter(step); position:absolute; left:0; top:0;
    width:24px; height:24px; border-radius:50%; background: var(--brick-soft); color:var(--brick);
    font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center;
  }
  .steplist b{ display:block; margin-bottom:2px; }

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background: var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px;
    z-index:200; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s;
    max-width: 85%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .leaflet-popup-content{ font-family:'Noto Sans TC',sans-serif; font-size:13px; }

  /* ---------- Lock screen ---------- */
  .lock-screen{
    position:fixed; inset:0; z-index:500; background: var(--bg-deep);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .lock-card{
    width:100%; max-width:320px; background: var(--surface); border:1px solid var(--line);
    border-radius: var(--radius-l); padding:32px 24px; text-align:center; box-shadow: var(--shadow);
  }
  .lock-card input{ text-align:center; letter-spacing:.3em; font-size:16px; }
  .lock-card .mark{
    border-radius:12px; background: var(--moss); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700;
  }
</style><style>
body{margin:0;background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--ink)}
#app{max-width:700px;margin:auto;padding:20px 18px 110px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-family:'Noto Serif TC',serif;font-size:25px;margin:0}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--ink-soft);font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.stack{display:grid;gap:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:white;color:var(--ink)}textarea{min-height:84px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit}.primary{background:var(--moss);color:white}.secondary{background:var(--moss-soft);color:var(--moss)}.danger{background:var(--brick-soft);color:var(--brick)}button:disabled{opacity:.5}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;border-top:1px solid var(--line);z-index:5}.tabs button{flex:1;max-width:175px;border:0;background:white;padding:13px 4px;color:var(--ink-soft);font:inherit;cursor:pointer}.tabs button.selected{color:var(--moss);font-weight:700;border-top:3px solid var(--moss)}.hidden{display:none!important}.item{border-top:1px solid var(--line);padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.item:first-child{border:0}.small{font-size:12px}.error{color:var(--brick)}.success{color:var(--moss)}.pill{border-radius:30px;padding:4px 10px;background:var(--moss-soft);color:var(--moss);font-size:12px}#message{min-height:20px}form{display:grid;gap:12px}.tabs button{touch-action:manipulation}@media(max-width:460px){.row2{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script><script src="config.js" defer></script><script src="app.js?v=20260924b" defer></script></head><body><main id="app"><header><div><h1>🐇 兔巢</h1><div class="muted">兔友互助 · 兔寶照護</div></div><button id="logout" class="secondary hidden">登出</button></header><p id="message" role="status"></p>
<section id="setup" class="panel hidden"><h2>設定尚未完成</h2><p>請先建立 Supabase 專案、執行資料表 SQL，並在 config.js 填入 Project URL 和 publishable key。</p></section>
<section id="auth" class="panel"><h2>信箱登入</h2><form id="authForm"><label>電子信箱<input name="email" type="email" autocomplete="email" required></label><label>密碼<input name="password" type="password" minlength="6" autocomplete="current-password" required></label><div class="actions"><button class="primary" name="mode" value="login">登入</button><button class="secondary" name="mode" value="signup">註冊</button><button class="secondary" name="mode" value="reset" formnovalidate>忘記密碼</button></div></form><p class="muted">註冊後請到信箱點選驗證連結。</p></section>
<section id="recover" class="panel hidden"><h2>設定新密碼</h2><form id="recoverForm"><label>新密碼<input name="password" type="password" minlength="6" required></label><button class="primary">更新密碼</button></form></section><div id="privateApp" class="hidden"><section id="community" class="page"><div class="panel"><h2>社群問答</h2><form id="postForm"><label>分類<select name="category"><option>新手發問</option><option>飲食照護</option><option>健康討論</option><option>日常分享</option></select></label><label>問題或分享<textarea name="content" maxlength="3000" required></textarea></label><button class="primary">發布</button></form></div><div id="postList" class="panel"></div></section>
<section id="records" class="page hidden"><div class="panel"><h2>兔寶紀錄</h2><form id="rabbitForm" class="row2"><label>兔寶名字<input name="name" required maxlength="60"></label><label>品種（選填）<input name="breed" maxlength="80"></label><button class="secondary">新增兔寶</button></form></div><div class="panel stack"><label>選擇兔寶<select id="rabbitRecord"></select></label><form id="careForm"><label>要記錄什麼<select name="kind" id="careKind"><option value="water">喝水</option><option value="poop">便便</option><option value="food">飲食</option><option value="medication">吃藥</option><option value="energy">精神狀況</option><option value="other">其他</option></select></label><label>時間<input name="occurred_at" type="datetime-local" required></label><div id="amountBox" class="row2"><label>數量<input name="amount" type="number" step="any" min="0"></label><label>單位<input name="unit" placeholder="ml、顆、mg 等" maxlength="30"></label></div><label>說明（藥名、便便狀況等）<textarea name="detail" maxlength="2000"></textarea></label><button class="primary">儲存紀錄</button></form></div><div id="careList" class="panel"></div></section>
<section id="reminders" class="page hidden"><div class="panel"><h2>提醒</h2><p class="muted">到期事項會在開啟網站時顯示；此版本尚未提供背景推播。</p><form id="reminderForm"><label>選擇兔寶<select id="rabbitReminder" name="rabbit_id"></select></label><label>提醒事項<input name="title" placeholder="例如：餵藥、回診" maxlength="120" required></label><label>提醒時間<input name="due_at" type="datetime-local" required></label><button class="primary">新增提醒</button></form></div><div id="reminderList" class="panel"></div></section>
<section id="medical" class="page hidden"><div class="panel"><h2>醫療紀錄</h2><p class="muted">就診與醫囑資料只有你的帳號能讀取。用藥請依獸醫指示。</p><form id="medicalForm"><label>選擇兔寶<select id="rabbitMedical" name="rabbit_id"></select></label><label>就診日期<input name="visited_at" type="date" required></label><label>醫院／獸醫<input name="clinic" maxlength="150"></label><label>就診原因<input name="reason" maxlength="300" required></label><label>醫囑與備註<textarea name="notes" maxlength="3000"></textarea></label><button class="primary">儲存就診紀錄</button></form></div><div id="medicalList" class="panel"></div><div class="panel"><h3>尋找兔科院所</h3><p class="muted">就診前請先致電確認是否收治兔子及當日門診時間。</p><a class="secondary" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/%E5%85%94%E5%AD%90+%E7%89%B9%E5%AF%B5+%E5%8B%95%E7%89%A9%E9%86%AB%E9%99%A2/">開啟醫療地圖搜尋</a></div></section><nav class="tabs" aria-label="主要功能"><button data-page="community" class="selected">社群</button><button data-page="records">紀錄</button><button data-page="reminders">提醒</button><button data-page="medical">醫療</button></nav></div></main></body></html>
